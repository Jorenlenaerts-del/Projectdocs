<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PROGRESSIE_FILE_JOREN_LENAERTS</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeInUp { animation: fadeInUp 1s ease-out forwards; }

    /* Gradient buttons/nav */
    .gradient-nav-link {
      background: linear-gradient(135deg, #41987b 0%, #3b82f6 100%);
      padding: 0.5rem 1.25rem;
      border-radius: 0.5rem;
      color: white;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .gradient-nav-link:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(59,130,246,0.4); }
    .dropdown-link {
      background: linear-gradient(135deg, #41987b 0%, #3b82f6 100%);
      border-radius: 0.5rem;
      color: white;
      font-weight: 600;
      transition: all 0.3s ease;
      padding: 0.5rem 0;
    }
    .dropdown-link:hover { transform: translateX(4px); box-shadow: 0 4px 12px rgba(59,130,246,0.3); }

    .image-gradient-border {
      position: relative;
      padding: 4px;
      background: linear-gradient(135deg, #41987b 0%, #3b82f6 100%);
      border-radius: 0.75rem;
      transition: all 0.3s ease;
    }
    .image-gradient-border img { border-radius: 0.5rem; display: block; }
    .image-gradient-border:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59,130,246,0.3); }

    .gradient-week-btn {
      background: linear-gradient(135deg, #41987b 0%, #3b82f6 100%);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .gradient-week-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59,130,246,0.4); }

    .header-container { display: flex; flex-direction: column; gap: 1.5rem; }
    .header-title { flex-shrink: 0; }
    .header-nav { display: flex; justify-content: flex-start; width: 100%; }
  </style>
</head>

<body class="bg-[#ececed]">

<!-- HEADER -->
<header class="shadow-sm animate-fadeInUp">
  <div class="max-w-5xl mx-auto px-6 py-6">
    <div class="header-container">
      <h1 class="text-3xl font-bold animate-pulse header-title">
        <a href="index.html">PROGRESSFILE — PROTOTYPING TOOLS</a>
      </h1>

      <nav class="header-nav">
        <ul class="flex gap-6 text-sm font-semibold flex-wrap items-center">

          <!-- HOME -->
          <li><a href="index.html" class="gradient-nav-link"><span>HOME</span></a></li>

          <!-- CONTACT -->
          <li><a href="Contactfile.html" class="gradient-nav-link"><span>CONTACT</span></a></li>

          <!-- DROPDOWN -->
          <li class="relative">
            <button id="dropdownBtn" class="gradient-nav-link flex items-center gap-1">
              <span>Weken</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>

            <div id="dropdownMenu" class="hidden absolute right-0 top-full mt-2 bg-white rounded-lg shadow-xl border border-gray-200 z-[1000] p-2 grid grid-cols-2 gap-2 min-w-[300px]">
              <a href="./z2Week1.html" class="dropdown-link block px-4 py-2">Week 1</a>
              <a href="./z3Week2.html" class="dropdown-link block px-4 py-2">Week 2</a>
              <a href="./z4Week3.html" class="dropdown-link block px-4 py-2">Week 3</a>
              <a href="./z5Week4.html" class="dropdown-link block px-4 py-2">Week 4</a>
              <a href="./z6Week5.html" class="dropdown-link block px-4 py-2">Week 5</a>
              <a href="./z7Week6.html" class="dropdown-link block px-4 py-2">Week 6</a>
              <a href="./z8Week7.html" class="dropdown-link block px-4 py-2">Week 7</a>
              <a href="./z9Week8.html" class="dropdown-link block px-4 py-2">Week 8</a>
              <a href="./z10Week9.html" class="dropdown-link block px-4 py-2">Week 9</a>
              <a href="./z11Week10.html" class="dropdown-link block px-4 py-2">Week 10</a>
              <a href="./z12Week11.html" class="dropdown-link block px-4 py-2">Week 11</a>
              <a href="./z13Week12.html" class="dropdown-link block px-4 py-2">Week 12</a>
            </div>
          </li>

        </ul>
      </nav>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="max-w-5xl mx-auto px-6 py-12 animate-fadeInUp">

  <header class="mb-12 text-center">
    <h1 class="text-4xl font-bold mb-3">Contact</h1>
    <p class="text-lg text-gray-600">Neem contact met mij op</p>
  </header>

  <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-200">

    <form>
      <div class="mb-6">
        <label class="block text-sm font-semibold mb-2">Naam</label>
        <input type="text" required
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div class="mb-6">
        <label class="block text-sm font-semibold mb-2">Email</label>
        <input type="email" required
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div class="mb-6">
        <label class="block text-sm font-semibold mb-2">Bericht</label>
        <textarea rows="5" required
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
      </div>

      <button type="submit"
        class="w-full gradient-nav-link justify-center text-lg py-3">
        Verstuur bericht
      </button>
    </form>

    <div class="mt-10 text-center text-gray-600">
      <p class="mb-2">📧 joren.lenaerts@example.com</p>
      <p>📱 +32 123 45 67 89</p>
    </div>

  </div>
</main>

<!-- FOOTER -->
<footer class="bg-[#f7f7f7] border-t border-gray-200 py-8 mt-12">
  <div class="max-w-5xl mx-auto px-6">
    <p class="text-sm text-gray-600">© 2025 Joren Lenaerts</p>
  </div>
</footer>

<script>
  const dropdownBtn = document.getElementById('dropdownBtn');
  const dropdownMenu = document.getElementById('dropdownMenu');

  dropdownBtn.addEventListener('click', () => {
    dropdownMenu.classList.toggle('hidden');
  });

  document.addEventListener('click', (e) => {
    if (!dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
      dropdownMenu.classList.add('hidden');
    }
  });
</script>

</body>
</html>
